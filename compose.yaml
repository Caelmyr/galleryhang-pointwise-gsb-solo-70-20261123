name: solo73-galleryhang
services:
  bench:
    build:
      context: .
      args:
        GALLERYHANG_DEPS_IMAGE: ${GALLERYHANG_DEPS_IMAGE:-python:3.11-slim}
    image: ${GALLERYHANG_IMAGE:-solo73-galleryhang:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      WAITRESS_THREADS: 4
    ports:
      - "127.0.0.1:${GALLERYHANG_PORT:-19993}:8000"
    volumes:
      - exhibition-library:/var/lib/galleryhang
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  exhibition-library:
